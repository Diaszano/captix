[project]
name = "txtcaptcha"
version = "0.1.0"
description = "Python port of the R captcha package: read, annotate, train and decrypt text captchas with a CRNN+CTC model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txtcaptcha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

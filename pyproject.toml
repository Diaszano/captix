[project]
name = "txtcaptcha"
version = "0.1.0.9000"
description = "Read, annotate, train and decrypt text captchas with a CRNN+CTC model."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Julio Trecenti", email = "jtrecenti@gmail.com" },
]
maintainers = [
    { name = "Julio Trecenti", email = "jtrecenti@gmail.com" },
]
keywords = [
    "captcha",
    "ocr",
    "crnn",
    "ctc",
    "pytorch",
    "deep-learning",
    "image-to-text",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.0",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
docs = [
    "quartodoc>=0.7",
    "griffe<1",
]

[project.urls]
Homepage = "https://github.com/jtrecenti/txtcaptcha"
Documentation = "https://jtrecenti.github.io/txtcaptcha/"
Repository = "https://github.com/jtrecenti/txtcaptcha"
Issues = "https://github.com/jtrecenti/txtcaptcha/issues"
Changelog = "https://github.com/jtrecenti/txtcaptcha/blob/main/CHANGELOG.md"
"Model (HF Hub)" = "https://huggingface.co/jtrecenti/txtcaptcha-crnn"

[project.scripts]
download_captchas = "txtcaptcha.download.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txtcaptcha"]

[tool.hatch.build.targets.sdist]
include = [
    "src/txtcaptcha",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

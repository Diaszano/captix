name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --extra dev

      - name: Run pre-commit checks
        env:
          SKIP: check-branch-name
        run: uv run pre-commit run --all-files

      - name: Check PR branch
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_branch_name.py --branch "$GITHUB_HEAD_REF"

      - name: Check PR title and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message_file="$RUNNER_TEMP/commit-message"
          printf '%s\n' "$PR_TITLE" > "$message_file"
          uv run pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename "$message_file"
          for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            git show -s --format=%B "$sha" > "$message_file"
            uv run pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename "$message_file"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q
